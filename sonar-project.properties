# SonarCloud configuration for Ivory DevOps Test
sonar.projectKey=ivory-devops-test
sonar.organization=ivory-it

# Project information
sonar.projectName=Ivory DevOps Test - Static Website
sonar.projectVersion=1.0.0

# Source code configuration
sonar.sources=.
sonar.exclusions=**/*.min.js,**/node_modules/**,**/img/**,**/ico/**,**/*.zip

# Language configuration
sonar.sourceEncoding=UTF-8

# Coverage reports
sonar.coverage.exclusions=**/*.html,**/js/**

# Quality gate
sonar.qualitygate.wait=true

# Web files configuration
sonar.web.file.suffixes=.html,.css,.js
sonar.css.file.suffixes=.css
sonar.javascript.file.suffixes=.js
